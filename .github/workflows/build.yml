name: Build MundoTouch and publish direct download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Recreate MundoTouch source
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/mundotouch_payload.tgz
          tar -xzf /tmp/mundotouch_payload.tgz -C "$GITHUB_WORKSPACE"

      - name: Build Nintendo Switch NRO
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -lc 'make clean all'

      - name: Prepare direct-download files
        shell: bash
        run: |
          set -e
          mkdir -p releases/package/switch/MundoTouch
          cp MundoTouch.nro releases/MundoTouch.nro
          cp MundoTouch.nro releases/package/switch/MundoTouch/MundoTouch.nro
          (cd releases/package && zip -qr ../MundoTouch-switch.zip switch)
          rm -rf releases/package
          sha256sum releases/MundoTouch.nro > releases/MundoTouch.nro.sha256

      - name: Publish compiled NRO to main branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/MundoTouch.nro releases/MundoTouch-switch.zip releases/MundoTouch.nro.sha256
          if git diff --cached --quiet; then
            echo "No binary changes to publish."
          else
            git commit -m "build: publish MundoTouch NRO [skip ci]"
            git push
          fi

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MundoTouch-NRO
          path: |
            releases/MundoTouch.nro
            releases/MundoTouch-switch.zip
            releases/MundoTouch.nro.sha256
