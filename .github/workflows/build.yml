name: Build MundoTouch 3.1 Polimento

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'MundoTouch3_3.1_POLIMENTO_source_v4.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack MundoTouch 3.1 source v4
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="MundoTouch3_3.1_POLIMENTO_source_v4.zip"

          echo "Checking source package: $SOURCE_ZIP"
          test -s "$SOURCE_ZIP"

          rm -rf MundoTouch3

          echo "Testing ZIP integrity..."
          unzip -tq "$SOURCE_ZIP"

          echo "Extracting MundoTouch 3.1 v4..."
          unzip -q "$SOURCE_ZIP" -d .

          test -f MundoTouch3/Makefile
          test -f MundoTouch3/source/main.cpp
          test -f MundoTouch3/scripts/gen_audio.py
          test -f MundoTouch3/scripts/prep_assets.py

          echo "MundoTouch 3.1 v4 source package OK."

      - name: Install audio and art tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            python3-pil \
            python3-pip \
            zip

          python3 -m pip install \
            --quiet \
            --break-system-packages \
            edge-tts

          ffmpeg -version | head -1
          python3 --version

          echo "Required tools installed."

      - name: Prepare MundoTouch 3.1 art assets
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          python3 scripts/prep_assets.py

          test -d romfs/assets

          ASSET_COUNT="$(find romfs/assets -maxdepth 1 -type f | wc -l)"
          COLOR_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'line_*.png' | wc -l)"
          HUNT_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'hunt_*.jpg' | wc -l)"

          echo "Total assets: $ASSET_COUNT"
          echo "Coloring drawings: $COLOR_COUNT"
          echo "Object-hunt scenes: $HUNT_COUNT"

          test "$ASSET_COUNT" -ge 40
          test "$COLOR_COUNT" -ge 20
          test "$HUNT_COUNT" -ge 5

          echo "Art asset validation passed."

      - name: Generate and prepare Brazilian Portuguese audio
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Generating neural pt-BR speech and preparing animal recordings..."

          python3 scripts/gen_audio.py

          test -d romfs/audio

          AUDIO_COUNT="$(
            find romfs/audio -type f \
              \( -name '*.wav' -o -name '*.ogg' \) |
            wc -l
          )"

          EMPTY_COUNT="$(
            find romfs/audio -type f \
              \( -name '*.wav' -o -name '*.ogg' \) \
              -size 0 |
            wc -l
          )"

          echo "Audio files generated: $AUDIO_COUNT"
          echo "Empty audio files: $EMPTY_COUNT"

          test "$AUDIO_COUNT" -ge 100
          test "$EMPTY_COUNT" -eq 0

          echo "Audio generation completed."

      - name: Validate audio QA
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          if [ -f audio_qa_report.json ]; then
            python3 -m json.tool audio_qa_report.json >/dev/null
            echo "audio_qa_report.json is valid."
          else
            echo "ERROR: audio_qa_report.json was not generated."
            exit 1
          fi

          BAD_AUDIO=0

          while IFS= read -r FILE; do
            if ! ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FILE" >/dev/null 2>&1; then

              echo "Invalid audio: $FILE"
              BAD_AUDIO=$((BAD_AUDIO + 1))
            fi
          done < <(
            find romfs/audio -type f \
              \( -name '*.wav' -o -name '*.ogg' \) |
            sort
          )

          echo "Invalid audio files: $BAD_AUDIO"
          test "$BAD_AUDIO" -eq 0

          echo "Audio QA passed."

      - name: Validate MundoTouch source
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          test -s source/main.cpp
          test -s Makefile

          grep -q "SDL" source/main.cpp

          echo "main.cpp:"
          wc -c source/main.cpp

          echo "Source validation passed."

      - name: Build Nintendo Switch NRO
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -lc '
              set -euo pipefail

              dkp-pacman -S \
                --needed \
                --noconfirm \
                switch-sdl2 \
                switch-sdl2_image \
                switch-sdl2_mixer \
                switch-sdl2_ttf

              make clean || true

              make -j2

              test -s MundoTouch.nro
            '

          echo "Nintendo Switch compilation completed."

      - name: Verify compiled NRO
        shell: bash
        run: |
          set -euo pipefail

          NRO="MundoTouch3/MundoTouch.nro"

          test -s "$NRO"

          SIZE="$(stat -c%s "$NRO")"

          echo "MundoTouch 3.1 NRO size: $SIZE bytes"

          if [ "$SIZE" -le 1000000 ]; then
            echo "ERROR: Generated NRO is unexpectedly small."
            exit 1
          fi

          echo "SHA256:"
          sha256sum "$NRO"

          echo "NRO validation passed."

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p releases
          rm -rf releases/package

          mkdir -p releases/package/switch/MundoTouch

          cp \
            MundoTouch3/MundoTouch.nro \
            releases/MundoTouch.nro

          cp \
            MundoTouch3/MundoTouch.nro \
            releases/package/switch/MundoTouch/MundoTouch.nro

          rm -f releases/MundoTouch-switch.zip

          (
            cd releases/package
            zip -qr ../MundoTouch-switch.zip switch
          )

          rm -rf releases/package

          sha256sum \
            releases/MundoTouch.nro \
            > releases/MundoTouch.nro.sha256

          echo "Release package:"
          ls -lh \
            releases/MundoTouch.nro \
            releases/MundoTouch-switch.zip \
            releases/MundoTouch.nro.sha256

      - name: Publish MundoTouch 3.1
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            releases/MundoTouch.nro \
            releases/MundoTouch-switch.zip \
            releases/MundoTouch.nro.sha256

          if git diff --cached --quiet; then
            echo "Release files are already current."
          else
            git commit \
              -m "build: publish MundoTouch 3.1 Polimento v4 [skip ci]"

            git push
          fi

      - name: Upload MundoTouch 3.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MundoTouch-3.1-Polimento-v4
          compression-level: 6
          if-no-files-found: error
          path: |
            releases/MundoTouch.nro
            releases/MundoTouch-switch.zip
            releases/MundoTouch.nro.sha256
            MundoTouch3/audio_qa_report.json
