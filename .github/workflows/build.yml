name: Build MundoTouch 3.1 Polimento

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'MundoTouch3_3.1_POLIMENTO_source_v3.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack MundoTouch 3.1 source v3
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking MundoTouch 3.1 v3 source ZIP..."

          test -s MundoTouch3_3.1_POLIMENTO_source_v3.zip

          echo "Removing temporary source directory..."

          rm -rf MundoTouch3

          echo "Extracting MundoTouch 3.1 v3..."

          unzip -q MundoTouch3_3.1_POLIMENTO_source_v3.zip -d .

          echo "Checking project structure..."

          test -f MundoTouch3/Makefile
          test -f MundoTouch3/source/main.cpp
          test -f MundoTouch3/scripts/gen_audio.py
          test -f MundoTouch3/scripts/prep_assets.py

          echo "MundoTouch 3.1 v3 source package OK."

      - name: Install audio and art tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            ffmpeg \
            espeak-ng \
            python3-pil \
            python3-pip \
            zip

          python3 -m pip install \
            --quiet \
            --break-system-packages \
            edge-tts

          echo "Required tools installed."

      - name: Prepare MundoTouch 3.1 art assets
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Generating art assets..."

          python3 scripts/prep_assets.py

          echo "Checking generated assets..."

          test -d romfs
          test -d romfs/assets

          ASSET_COUNT="$(find romfs/assets -maxdepth 1 -type f | wc -l)"

          echo "Total generated assets: $ASSET_COUNT"

          if [ "$ASSET_COUNT" -lt 20 ]; then
            echo "ERROR: Expected at least 20 generated assets."
            exit 1
          fi

          echo "Generated assets:"
          find romfs/assets \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo "Art asset validation completed successfully."

      - name: Generate Brazilian Portuguese audio
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Generating Brazilian Portuguese neural audio..."

          python3 scripts/gen_audio.py

          echo "Checking generated audio..."

          test -d romfs/audio

          AUDIO_COUNT="$(
            find romfs/audio \
              -type f \
              \( -name '*.wav' -o -name '*.ogg' \) \
              | wc -l
          )"

          echo "Total audio files: $AUDIO_COUNT"

          if [ "$AUDIO_COUNT" -lt 100 ]; then
            echo "ERROR: Expected at least 100 audio files."
            exit 1
          fi

          echo "Audio generation completed successfully."

      - name: Validate generated audio
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Validating audio files..."

          AUDIO_COUNT="$(
            find romfs/audio \
              -type f \
              \( -name '*.wav' -o -name '*.ogg' \) \
              | wc -l
          )"

          EMPTY_AUDIO="$(
            find romfs/audio \
              -type f \
              \( -name '*.wav' -o -name '*.ogg' \) \
              -size 0 \
              | wc -l
          )"

          echo "Audio files: $AUDIO_COUNT"
          echo "Empty audio files: $EMPTY_AUDIO"

          if [ "$AUDIO_COUNT" -lt 100 ]; then
            echo "ERROR: Insufficient audio files."
            exit 1
          fi

          if [ "$EMPTY_AUDIO" -ne 0 ]; then
            echo "ERROR: Empty audio files were detected."
            exit 1
          fi

          if [ -f audio_qa_report.json ]; then
            echo "Validating audio_qa_report.json..."

            python3 -m json.tool \
              audio_qa_report.json \
              >/dev/null

            echo "Audio QA JSON is valid."
          else
            echo "WARNING: audio_qa_report.json not found."
            echo "Audio files themselves passed the required checks."
          fi

          echo "Audio validation completed successfully."

      - name: Validate MundoTouch 3.1 source
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Validating source code..."

          test -s source/main.cpp
          test -s Makefile

          grep -q "SDL" source/main.cpp

          echo "main.cpp size:"
          wc -c source/main.cpp

          echo "Source validation completed successfully."

      - name: Build Nintendo Switch NRO
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Starting Nintendo Switch compilation..."

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -lc '
              set -euo pipefail

              echo "Installing Nintendo Switch SDL2 libraries..."

              dkp-pacman -S \
                --needed \
                --noconfirm \
                switch-sdl2 \
                switch-sdl2_image \
                switch-sdl2_mixer \
                switch-sdl2_ttf

              echo "Cleaning previous build..."

              make clean || true

              echo "Compiling MundoTouch 3.1..."

              make -j2

              echo "Nintendo Switch compilation completed."
            '

      - name: Verify MundoTouch 3.1 NRO
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking compiled NRO..."

          test -s MundoTouch3/MundoTouch.nro

          SIZE="$(stat -c%s MundoTouch3/MundoTouch.nro)"

          echo "MundoTouch 3.1 NRO size: $SIZE bytes"

          if [ "$SIZE" -le 1000000 ]; then
            echo "ERROR: MundoTouch.nro is unexpectedly small."
            exit 1
          fi

          echo "SHA256:"
          sha256sum MundoTouch3/MundoTouch.nro

          echo "NRO validation completed successfully."

      - name: Prepare DBI direct-download files
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing release files..."

          mkdir -p releases

          rm -rf releases/package

          mkdir -p \
            releases/package/switch/MundoTouch

          cp \
            MundoTouch3/MundoTouch.nro \
            releases/MundoTouch.nro

          cp \
            MundoTouch3/MundoTouch.nro \
            releases/package/switch/MundoTouch/MundoTouch.nro

          rm -f \
            releases/MundoTouch-switch.zip

          (
            cd releases/package
            zip -qr \
              ../MundoTouch-switch.zip \
              switch
          )

          rm -rf releases/package

          sha256sum \
            releases/MundoTouch.nro \
            > releases/MundoTouch.nro.sha256

          echo "Release files:"

          ls -lh \
            releases/MundoTouch.nro \
            releases/MundoTouch-switch.zip \
            releases/MundoTouch.nro.sha256

      - name: Publish MundoTouch 3.1
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing release commit..."

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            releases/MundoTouch.nro \
            releases/MundoTouch-switch.zip \
            releases/MundoTouch.nro.sha256

          if git diff --cached --quiet; then
            echo "No binary changes to publish."
          else
            echo "Publishing MundoTouch 3.1..."

            git commit \
              -m "build: publish MundoTouch 3.1 Polimento [skip ci]"

            git push
          fi

      - name: Upload MundoTouch 3.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MundoTouch-3.1-Polimento-NRO
          compression-level: 6
          if-no-files-found: error
          path: |
            releases/MundoTouch.nro
            releases/MundoTouch-switch.zip
            releases/MundoTouch.nro.sha256
            MundoTouch3/audio_qa_report.json
