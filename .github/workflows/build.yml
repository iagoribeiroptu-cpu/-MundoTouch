name: Build MundoTouch 3.3 Professional

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'MundoTouch3_3.3_PROFESSIONAL_source_v7.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack MundoTouch 3.3 Professional v7
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="MundoTouch3_3.3_PROFESSIONAL_source_v7.zip"

          echo "Checking source package: $SOURCE_ZIP"
          test -s "$SOURCE_ZIP"

          echo "Testing ZIP integrity..."
          unzip -tq "$SOURCE_ZIP"

          rm -rf MundoTouch3

          echo "Extracting MundoTouch 3.3 Professional v7..."
          unzip -q "$SOURCE_ZIP" -d .

          echo "Validating extracted project structure..."

          test -f MundoTouch3/Makefile
          test -f MundoTouch3/source/main.cpp
          test -f MundoTouch3/scripts/gen_audio.py
          test -f MundoTouch3/scripts/prep_assets.py

          echo "MundoTouch 3.3 Professional v7 source package OK."

      - name: Install audio and art tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            ffmpeg \
            python3-pil \
            python3-pip \
            zip

          python3 -m pip install \
            --quiet \
            --break-system-packages \
            edge-tts

          ffmpeg -version | head -1
          python3 --version

          echo "Required tools installed."

      - name: Validate Python scripts
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          python3 -m py_compile \
            scripts/gen_audio.py \
            scripts/prep_assets.py

          echo "Python scripts passed syntax validation."

      - name: Prepare Professional visual assets
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Generating MundoTouch Professional assets..."

          python3 scripts/prep_assets.py

          test -d romfs/assets

          ASSET_COUNT="$(find romfs/assets -maxdepth 1 -type f | wc -l)"
          COLOR_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'line_*.png' | wc -l)"
          HUNT_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'hunt_*.jpg' | wc -l)"
          STORY_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'story_*' | wc -l)"
          SPRITE_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'sprite_*' | wc -l)"

          echo "=========================================="
          echo "MundoTouch 3.3 Professional visual QA"
          echo "=========================================="
          echo "Total assets.............: $ASSET_COUNT"
          echo "Coloring pages...........: $COLOR_COUNT"
          echo "Object-hunt scenes.......: $HUNT_COUNT"
          echo "Story illustrations......: $STORY_COUNT"
          echo "Professional sprites.....: $SPRITE_COUNT"
          echo "=========================================="

          if [ "$ASSET_COUNT" -lt 90 ]; then
            echo "ERROR: Professional build expected at least 90 visual assets."
            exit 1
          fi

          if [ "$COLOR_COUNT" -lt 20 ]; then
            echo "ERROR: Expected at least 20 coloring pages."
            exit 1
          fi

          if [ "$HUNT_COUNT" -lt 5 ]; then
            echo "ERROR: Expected at least 5 object-hunt scenes."
            exit 1
          fi

          if [ "$STORY_COUNT" -lt 30 ]; then
            echo "ERROR: Expected at least 30 illustrated story pages."
            exit 1
          fi

          if [ "$SPRITE_COUNT" -lt 30 ]; then
            echo "ERROR: Expected at least 30 professional sprites."
            exit 1
          fi

          echo "Professional visual asset validation passed."

      - name: Validate image files
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("romfs/assets")
          valid_ext = {".png", ".jpg", ".jpeg"}

          files = [
              p for p in root.iterdir()
              if p.is_file() and p.suffix.lower() in valid_ext
          ]

          if not files:
              raise SystemExit("ERROR: No visual assets found.")

          bad = []

          for path in files:
              try:
                  with Image.open(path) as img:
                      img.verify()

                  with Image.open(path) as img:
                      w, h = img.size

                  if w < 64 or h < 64:
                      bad.append(
                          f"{path.name}: unexpectedly small ({w}x{h})"
                      )

              except Exception as exc:
                  bad.append(f"{path.name}: {exc}")

          print(f"Validated image files: {len(files)}")

          if bad:
              print("INVALID VISUAL ASSETS:")
              for item in bad:
                  print(" -", item)
              raise SystemExit(1)

          print("All image assets passed decoding validation.")
          PY

      - name: Generate Brazilian Portuguese audio
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Generating neural pt-BR narration and effects..."

          python3 scripts/gen_audio.py

          test -d romfs/audio

          AUDIO_COUNT="$(
            find romfs/audio \
              -type f \
              \( -name '*.wav' -o -name '*.ogg' \) |
            wc -l
          )"

          EMPTY_COUNT="$(
            find romfs/audio \
              -type f \
              \( -name '*.wav' -o -name '*.ogg' \) \
              -size 0 |
            wc -l
          )"

          echo "Audio files generated: $AUDIO_COUNT"
          echo "Empty audio files: $EMPTY_COUNT"

          if [ "$AUDIO_COUNT" -lt 100 ]; then
            echo "ERROR: Expected at least 100 audio files."
            exit 1
          fi

          if [ "$EMPTY_COUNT" -ne 0 ]; then
            echo "ERROR: Empty audio files detected."
            exit 1
          fi

          echo "Audio generation completed."

      - name: Validate generated audio
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          if [ ! -f audio_qa_report.json ]; then
            echo "ERROR: audio_qa_report.json was not generated."
            exit 1
          fi

          python3 -m json.tool audio_qa_report.json >/dev/null

          BAD_AUDIO=0

          while IFS= read -r FILE; do
            if ! ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FILE" >/dev/null 2>&1; then

              echo "INVALID AUDIO: $FILE"
              BAD_AUDIO=$((BAD_AUDIO + 1))
            fi
          done < <(
            find romfs/audio \
              -type f \
              \( -name '*.wav' -o -name '*.ogg' \) |
            sort
          )

          echo "Invalid audio files: $BAD_AUDIO"

          if [ "$BAD_AUDIO" -ne 0 ]; then
            echo "ERROR: Audio QA failed."
            exit 1
          fi

          echo "Audio QA passed."

      - name: Validate MundoTouch Professional source
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          test -s source/main.cpp
          test -s Makefile

          grep -q "SDL" source/main.cpp

          echo "main.cpp:"
          wc -l source/main.cpp
          wc -c source/main.cpp

          echo "Checking required Professional interactions..."

          python3 - <<'PY'
          from pathlib import Path

          src = Path("source/main.cpp").read_text(
              encoding="utf-8",
              errors="ignore"
          ).lower()

          groups = {
              "touch input": [
                  "sdl_fingerdown",
                  "sdl_fingermotion",
                  "sdl_fingerup",
              ],
              "SDL image support": [
                  "img_load",
                  "sdl_texture",
              ],
              "audio": [
                  "mix_",
              ],
          }

          missing = []

          for feature, tokens in groups.items():
              if not any(token in src for token in tokens):
                  missing.append(feature)

          if missing:
              print("ERROR: Required source capabilities missing:")
              for item in missing:
                  print(" -", item)
              raise SystemExit(1)

          print("Required Professional interaction primitives detected.")
          PY

          echo "Source validation passed."

      - name: Build Nintendo Switch NRO
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Starting Nintendo Switch compilation..."

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -lc '
              set -euo pipefail

              dkp-pacman -S \
                --needed \
                --noconfirm \
                switch-sdl2 \
                switch-sdl2_image \
                switch-sdl2_mixer \
                switch-sdl2_ttf

              make clean || true

              echo "Compiling MundoTouch 3.3 Professional..."

              make -j2

              test -s MundoTouch.nro

              echo "Nintendo Switch compilation successful."
            '

      - name: Verify compiled NRO
        shell: bash
        run: |
          set -euo pipefail

          NRO="MundoTouch3/MundoTouch.nro"

          test -s "$NRO"

          SIZE="$(stat -c%s "$NRO")"

          echo "=========================================="
          echo "MundoTouch 3.3 Professional"
          echo "NRO size: $SIZE bytes"
          echo "=========================================="

          if [ "$SIZE" -le 1000000 ]; then
            echo "ERROR: Generated NRO is unexpectedly small."
            exit 1
          fi

          sha256sum "$NRO"

          echo "NRO validation passed."

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p releases

          rm -rf releases/package

          mkdir -p releases/package/switch/MundoTouch

          cp \
            MundoTouch3/MundoTouch.nro \
            releases/MundoTouch.nro

          cp \
            MundoTouch3/MundoTouch.nro \
            releases/package/switch/MundoTouch/MundoTouch.nro

          rm -f releases/MundoTouch-switch.zip

          (
            cd releases/package
            zip -qr ../MundoTouch-switch.zip switch
          )

          rm -rf releases/package

          sha256sum \
            releases/MundoTouch.nro \
            > releases/MundoTouch.nro.sha256

          echo "Release files:"
          ls -lh \
            releases/MundoTouch.nro \
            releases/MundoTouch-switch.zip \
            releases/MundoTouch.nro.sha256

      - name: Publish MundoTouch 3.3 Professional
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            releases/MundoTouch.nro \
            releases/MundoTouch-switch.zip \
            releases/MundoTouch.nro.sha256

          if git diff --cached --quiet; then
            echo "Release files are already current."
          else
            git commit \
              -m "build: publish MundoTouch 3.3 Professional v7 [skip ci]"

            git push
          fi

      - name: Upload MundoTouch 3.3 Professional artifact
        uses: actions/upload-artifact@v4
        with:
          name: MundoTouch-3.3-Professional-v7
          compression-level: 6
          if-no-files-found: error
          path: |
            releases/MundoTouch.nro
            releases/MundoTouch-switch.zip
            releases/MundoTouch.nro.sha256
            MundoTouch3/audio_qa_report.json
            MundoTouch3/ANIMAL_AUDIO_CREDITS.txt
