name: Build MundoTouch 2.0 with audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate MundoTouch 2 source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT="1d3e2637b0c82e72c3cb2ec9abde96c98d302c10"

          echo "Restoring MundoTouch source from commit:"
          echo "$SOURCE_COMMIT"

          git cat-file -e "${SOURCE_COMMIT}^{commit}"

          git show "${SOURCE_COMMIT}:.github/workflows/build.yml" \
            > /tmp/mundotouch_source_workflow.yml

          awk '
            /cat > \/tmp\/mundotouch_v2\.b64/ {
              capture=1
              next
            }

            capture && /^[[:space:]]*PAYLOAD[[:space:]]*$/ {
              exit
            }

            capture {
              sub(/^[[:space:]]+/, "")
              print
            }
          ' /tmp/mundotouch_source_workflow.yml \
            > /tmp/mundotouch_v2.b64

          echo "Checking embedded source payload..."

          test -s /tmp/mundotouch_v2.b64

          base64 -d /tmp/mundotouch_v2.b64 \
            > /tmp/mundotouch_v2.tgz

          echo "Checking source archive..."

          tar -tzf /tmp/mundotouch_v2.tgz >/dev/null

          echo "Extracting MundoTouch source..."

          tar -xzf /tmp/mundotouch_v2.tgz \
            -C "$GITHUB_WORKSPACE"

          echo
          echo "MundoTouch source restored successfully."
          echo

          test -f Makefile
          test -f scripts/gen_audio.py

      - name: Install voice generation tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            espeak \
            ffmpeg

          echo
          echo "Voice generation tools installed successfully."

      - name: Generate Brazilian Portuguese voices and animal sounds
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating MundoTouch audio library..."

          python3 scripts/gen_audio.py

          echo
          echo "Audio generation finished."
          echo

          AUDIO_COUNT="$(find generated/audio \
            -maxdepth 1 \
            -type f \
            -name '*.pcm' \
            | wc -l)"

          echo "PCM audio files generated: ${AUDIO_COUNT}"

          du -sh generated/audio

          if [ "${AUDIO_COUNT}" -lt 1 ]; then
            echo "ERROR: No audio files were generated."
            exit 1
          fi

          echo
          echo "Audio library verified successfully."

      - name: Build Nintendo Switch NRO
        shell: bash
        run: |
          set -euo pipefail

          echo "Building MundoTouch for Nintendo Switch..."

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -lc 'make clean all'

          echo
          echo "Nintendo Switch build command completed."

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated NRO..."

          test -s MundoTouch.nro

          echo
          echo "MundoTouch.nro generated successfully:"
          ls -lh MundoTouch.nro

          echo
          echo "SHA256:"
          sha256sum MundoTouch.nro

      - name: Prepare direct-download files
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing MundoTouch download package..."

          rm -rf releases/package
          rm -f releases/MundoTouch-switch.zip

          mkdir -p releases/package/switch/MundoTouch

          cp MundoTouch.nro \
            releases/MundoTouch.nro

          cp MundoTouch.nro \
            releases/package/switch/MundoTouch/MundoTouch.nro

          (
            cd releases/package
            zip -qr ../MundoTouch-switch.zip switch
          )

          rm -rf releases/package

          sha256sum releases/MundoTouch.nro \
            > releases/MundoTouch.nro.sha256

          echo
          echo "Download files prepared:"
          ls -lh \
            releases/MundoTouch.nro \
            releases/MundoTouch-switch.zip \
            releases/MundoTouch.nro.sha256

      - name: Publish MundoTouch 2.0 to main branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            releases/MundoTouch.nro \
            releases/MundoTouch-switch.zip \
            releases/MundoTouch.nro.sha256

          if git diff --cached --quiet; then

            echo "No binary changes to publish."

          else

            echo "Publishing new MundoTouch build..."

            git commit \
              -m "build: publish MundoTouch 2.0 audio edition [skip ci]"

            git push

            echo
            echo "MundoTouch build published successfully."

          fi

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MundoTouch-2.0-NRO
          compression-level: 6
          if-no-files-found: error
          path: |
            releases/MundoTouch.nro
            releases/MundoTouch-switch.zip
            releases/MundoTouch.nro.sha256
