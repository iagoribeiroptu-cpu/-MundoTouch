name: Build MundoTouch 3.0 Professional

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'MundoTouch3_source_final.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack MundoTouch 3.0 source
        shell: bash
        run: |
          set -euo pipefail
          test -s MundoTouch3_source_final.zip
          rm -rf MundoTouch3
          unzip -q MundoTouch3_source_final.zip -d .
          test -f MundoTouch3/Makefile
          test -f MundoTouch3/source/main.cpp
          test -f MundoTouch3/scripts/gen_audio.py
          test -f MundoTouch3/scripts/prep_assets.py

      - name: Install neural audio and art tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng python3-pil python3-pip zip
          python3 -m pip install --quiet --break-system-packages edge-tts

      - name: Prepare professional art assets
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail
          python3 scripts/prep_assets.py
          test -s romfs/assets/story_lion_2.jpg
          test -s romfs/assets/story_elephant_3.jpg
          test -s romfs/assets/story_turtle_3.jpg
          test -s romfs/assets/line_elephant.png
          test -s romfs/assets/line_giraffe.png
          test -s romfs/assets/line_turtle.png

      - name: Generate Brazilian Portuguese narration and sounds
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail
          python3 scripts/gen_audio.py
          AUDIO_COUNT="$(find romfs/audio -maxdepth 1 -type f -name '*.wav' | wc -l)"
          echo "Audio files generated: $AUDIO_COUNT"
          test "$AUDIO_COUNT" -ge 120
          test -s romfs/audio/welcome.wav
          test -s romfs/audio/hunt_intro.wav
          test -s romfs/audio/story_lion_1.wav
          test -s romfs/audio/music.wav

      - name: Build Nintendo Switch NRO
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -lc 'dkp-pacman -S --needed --noconfirm switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf >/dev/null && make clean all'

      - name: Verify MundoTouch 3.0
        shell: bash
        run: |
          set -euo pipefail
          test -s MundoTouch3/MundoTouch.nro
          SIZE="$(stat -c%s MundoTouch3/MundoTouch.nro)"
          echo "MundoTouch 3.0 NRO size: $SIZE bytes"
          test "$SIZE" -gt 1000000
          sha256sum MundoTouch3/MundoTouch.nro

      - name: Prepare DBI direct-download files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf releases/package
          mkdir -p releases/package/switch/MundoTouch
          cp MundoTouch3/MundoTouch.nro releases/MundoTouch.nro
          cp MundoTouch3/MundoTouch.nro releases/package/switch/MundoTouch/MundoTouch.nro
          rm -f releases/MundoTouch-switch.zip
          (cd releases/package && zip -qr ../MundoTouch-switch.zip switch)
          rm -rf releases/package
          sha256sum releases/MundoTouch.nro > releases/MundoTouch.nro.sha256
          ls -lh releases/MundoTouch.nro releases/MundoTouch-switch.zip releases/MundoTouch.nro.sha256

      - name: Publish MundoTouch 3.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/MundoTouch.nro releases/MundoTouch-switch.zip releases/MundoTouch.nro.sha256
          if git diff --cached --quiet; then
            echo "No binary changes to publish."
          else
            git commit -m "build: publish MundoTouch 3.0 professional edition [skip ci]"
            git push
          fi

      - name: Upload MundoTouch 3.0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MundoTouch-3.0-NRO
          compression-level: 6
          if-no-files-found: error
          path: |
            releases/MundoTouch.nro
            releases/MundoTouch-switch.zip
            releases/MundoTouch.nro.sha256
