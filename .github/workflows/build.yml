      - name: Install voice generation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg

      - name: Generate Brazilian Portuguese voices and animal sounds
        shell: bash
        run: |
          python3 scripts/gen_audio.py
          du -sh generated/audio
          ls -lh generated/audio | head -20

      - name: Build Nintendo Switch NRO
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -lc 'make clean all'

      - name: Verify build
        shell: bash
        run: |
          test -s MundoTouch.nro
          ls -lh MundoTouch.nro

      - name: Prepare direct-download files
        shell: bash
        run: |
          set -e
          mkdir -p releases/package/switch/MundoTouch
          cp MundoTouch.nro releases/MundoTouch.nro
          cp MundoTouch.nro releases/package/switch/MundoTouch/MundoTouch.nro
          (cd releases/package && zip -qr ../MundoTouch-switch.zip switch)
          rm -rf releases/package
          sha256sum releases/MundoTouch.nro > releases/MundoTouch.nro.sha256

      - name: Publish MundoTouch 2.0 to main branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/MundoTouch.nro releases/MundoTouch-switch.zip releases/MundoTouch.nro.sha256
          if git diff --cached --quiet; then
            echo "No binary changes to publish."
          else
            git commit -m "build: publish MundoTouch 2.0 audio edition [skip ci]"
            git push
          fi

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MundoTouch-2.0-NRO
          compression-level: 6
          path: |
            releases/MundoTouch.nro
            releases/MundoTouch-switch.zip
            releases/MundoTouch.nro.sha256
