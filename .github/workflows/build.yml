name: Build MundoTouch 3.3 Professional

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'MundoTouch3_3.3_PROFESSIONAL_source_v7.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack MundoTouch 3.3 Professional v7
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="MundoTouch3_3.3_PROFESSIONAL_source_v7.zip"

          echo "Checking source package: $SOURCE_ZIP"
          test -s "$SOURCE_ZIP"

          echo "Testing ZIP integrity..."
          unzip -tq "$SOURCE_ZIP"

          rm -rf MundoTouch3

          echo "Extracting MundoTouch 3.3 Professional v7..."
          unzip -q "$SOURCE_ZIP" -d .

          test -f MundoTouch3/Makefile
          test -f MundoTouch3/source/main.cpp
          test -f MundoTouch3/scripts/gen_audio.py
          test -f MundoTouch3/scripts/prep_assets.py

          echo "MundoTouch 3.3 Professional v7 source package OK."

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            ffmpeg \
            python3-pil \
            python3-pip \
            zip

          python3 -m pip install \
            --quiet \
            --break-system-packages \
            edge-tts

          ffmpeg -version | head -1
          python3 --version

      - name: Validate Python scripts
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          python3 -m py_compile \
            scripts/gen_audio.py \
            scripts/prep_assets.py

          echo "Python validation passed."

      - name: Generate and validate Professional visual assets
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          python3 scripts/prep_assets.py

          test -d romfs/assets

          ASSET_COUNT="$(find romfs/assets -maxdepth 1 -type f | wc -l)"
          COLOR_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'line_*.png' | wc -l)"
          HUNT_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'hunt_*.jpg' | wc -l)"
          STORY_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'story_*' | wc -l)"
          SPRITE_COUNT="$(find romfs/assets -maxdepth 1 -type f -name 'sprite_*' | wc -l)"

          echo "========================================"
          echo "MundoTouch Professional Asset QA"
          echo "Total assets:        $ASSET_COUNT"
          echo "Coloring pages:      $COLOR_COUNT"
          echo "Hunt scenes:         $HUNT_COUNT"
          echo "Story pages:         $STORY_COUNT"
          echo "Sprites:             $SPRITE_COUNT"
          echo "========================================"

          test "$ASSET_COUNT" -ge 90
          test "$COLOR_COUNT" -ge 20
          test "$HUNT_COUNT" -ge 5
          test "$STORY_COUNT" -ge 30
          test "$SPRITE_COUNT" -ge 30

      - name: Validate all images
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("romfs/assets")
          files = [
              p for p in root.iterdir()
              if p.is_file()
              and p.suffix.lower() in {".png", ".jpg", ".jpeg"}
          ]

          if len(files) < 90:
              raise SystemExit(
                  f"ERROR: only {len(files)} image assets found"
              )

          errors = []

          for path in files:
              try:
                  with Image.open(path) as image:
                      image.verify()

                  with Image.open(path) as image:
                      width, height = image.size

                  if width < 64 or height < 64:
                      errors.append(
                          f"{path.name}: {width}x{height}"
                      )

              except Exception as exc:
                  errors.append(
                      f"{path.name}: {exc}"
                  )

          print(f"Images validated: {len(files)}")

          if errors:
              print("Image validation errors:")
              for error in errors:
                  print(error)
              raise SystemExit(1)

          print("All visual assets are valid.")
          PY

      - name: Generate Brazilian Portuguese audio
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          echo "Generating neural pt-BR audio..."

          python3 scripts/gen_audio.py

          test -d romfs/audio

          AUDIO_COUNT="$(
            find romfs/audio \
              -type f \
              \( -name '*.wav' -o -name '*.ogg' \) |
            wc -l
          )"

          EMPTY_COUNT="$(
            find romfs/audio \
              -type f \
              \( -name '*.wav' -o -name '*.ogg' \) \
              -size 0 |
            wc -l
          )"

          echo "Audio files: $AUDIO_COUNT"
          echo "Empty audio: $EMPTY_COUNT"

          test "$AUDIO_COUNT" -ge 150
          test "$EMPTY_COUNT" -eq 0

      - name: Validate generated audio
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          test -f audio_qa_report.json

          python3 -m json.tool \
            audio_qa_report.json \
            >/dev/null

          BAD_AUDIO=0

          while IFS= read -r FILE; do
            if ! ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FILE" \
              >/dev/null 2>&1; then

              echo "INVALID AUDIO: $FILE"
              BAD_AUDIO=$((BAD_AUDIO + 1))
            fi
          done < <(
            find romfs/audio \
              -type f \
              \( -name '*.wav' -o -name '*.ogg' \) |
            sort
          )

          echo "Invalid audio files: $BAD_AUDIO"

          test "$BAD_AUDIO" -eq 0

      - name: Validate source
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          test -s source/main.cpp
          test -s Makefile

          grep -q "SDL" source/main.cpp
          grep -qi "SDL_FINGERDOWN" source/main.cpp
          grep -qi "SDL_FINGERMOTION" source/main.cpp
          grep -qi "SDL_FINGERUP" source/main.cpp
          grep -qi "IMG_Load" source/main.cpp
          grep -qi "Mix_" source/main.cpp

          echo "Source:"
          wc -l source/main.cpp
          wc -c source/main.cpp

          echo "Source validation passed."

      - name: Build Nintendo Switch NRO
        shell: bash
        working-directory: MundoTouch3
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -lc '
              set -euo pipefail

              dkp-pacman -S \
                --needed \
                --noconfirm \
                switch-sdl2 \
                switch-sdl2_image \
                switch-sdl2_mixer \
                switch-sdl2_ttf

              make clean || true

              echo "Compiling MundoTouch 3.3 Professional..."

              make -j2

              test -s MundoTouch.nro

              echo "Nintendo Switch compilation successful."
            '

      - name: Verify compiled NRO
        shell: bash
        run: |
          set -euo pipefail

          NRO="MundoTouch3/MundoTouch.nro"

          test -s "$NRO"

          SIZE="$(stat -c%s "$NRO")"

          echo "========================================"
          echo "MundoTouch 3.3 Professional"
          echo "NRO size: $SIZE bytes"
          echo "========================================"

          test "$SIZE" -gt 1000000

          sha256sum "$NRO"

      - name: Prepare downloadable package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/switch/MundoTouch

          cp \
            MundoTouch3/MundoTouch.nro \
            dist/MundoTouch.nro

          cp \
            MundoTouch3/MundoTouch.nro \
            dist/switch/MundoTouch/MundoTouch.nro

          (
            cd dist
            zip -qr MundoTouch-switch.zip switch
          )

          sha256sum \
            dist/MundoTouch.nro \
            > dist/MundoTouch.nro.sha256

          echo "========================================"
          echo "FINAL DISTRIBUTION FILES"
          echo "========================================"

          ls -lh \
            dist/MundoTouch.nro \
            dist/MundoTouch-switch.zip \
            dist/MundoTouch.nro.sha256

          echo ""
          echo "SHA256:"
          cat dist/MundoTouch.nro.sha256

      - name: Upload MundoTouch 3.3 Professional
        uses: actions/upload-artifact@v4
        with:
          name: MundoTouch-3.3-Professional-v7
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/MundoTouch.nro
            dist/MundoTouch-switch.zip
            dist/MundoTouch.nro.sha256
            MundoTouch3/audio_qa_report.json
            MundoTouch3/ANIMAL_AUDIO_CREDITS.txt

      - name: Build summary
        shell: bash
        run: |
          {
            echo "# MundoTouch 3.3 Professional v7"
            echo ""
            echo "Nintendo Switch build completed successfully."
            echo ""
            echo "## Package"
            echo "- MundoTouch.nro"
            echo "- MundoTouch-switch.zip"
            echo "- SHA-256 verification file"
            echo "- Audio QA report"
            echo ""
            echo "Download the artifact:"
            echo "**MundoTouch-3.3-Professional-v7**"
          } >> "$GITHUB_STEP_SUMMARY"
